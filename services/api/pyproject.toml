[project]
name = "meridian-api"
version = "0.1.0"
description = "Meridian AI backend API (FastAPI + PostgreSQL)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Multipart parsing for ZIP source uploads (M3). No other new runtime
    # dependency: archives land in Postgres + temp dirs, not object storage.
    "python-multipart>=0.0.18",
    # S3-compatible private snapshot content storage (M5.1, MinIO).
    # Pure-python client; no build toolchain needed.
    "boto3>=1.34",
    # Container runtime SDK for the M5.2 sandbox orchestrator (worker only
    # ever talks to the local Docker Desktop daemon; never a remote one).
    "docker>=7",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "email-validator>=2.0",
    "bcrypt>=4.1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = false
warn_unreachable = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
