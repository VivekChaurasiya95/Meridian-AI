name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@localhost:5432/meridian
      TEST_DATABASE_URL: postgresql+psycopg://meridian:meridian@localhost:5432/meridian_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create test database
        run: PGPASSWORD=meridian psql -h localhost -U meridian -d meridian -c "CREATE DATABASE meridian_test;"
      - name: Install
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Lint and format check
        working-directory: services/api
        run: ruff check . && ruff format --check .
      - name: Typecheck
        working-directory: services/api
        run: mypy app
      - name: Migrate (dev database)
        run: alembic upgrade head
      - name: Test
        working-directory: services/api
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Install browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: apps/web
        run: npm run e2e
