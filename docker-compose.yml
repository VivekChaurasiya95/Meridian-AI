name: meridian

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5435:5432"
    volumes:
      - meridian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"   # S3 API
      - "9011:9001"   # MinIO Web Console
    volumes:
      - meridian_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # One-shot bucket setup: runs once, then exits 0 (stopped = finished).
    image: quay.io/minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/meridian-evidence --ignore-existing;
      mc mb local/meridian-repositories --ignore-existing;
      mc admin user add local meridian-worker meridian-worker-secret 2>/dev/null || true;
      mc admin user info local meridian-worker;
      printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:ListBucket"],"Resource":["arn:aws:s3:::meridian-repositories","arn:aws:s3:::meridian-repositories/*"]}]}' > /tmp/sandbox-repositories-read.json;
      mc admin policy create local sandbox-repositories-read /tmp/sandbox-repositories-read.json;
      mc admin policy info local sandbox-repositories-read;
      mc admin policy attach local sandbox-repositories-read --user meridian-worker;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MERIDIAN_ENV: dev
      DATABASE_URL: postgresql+psycopg://meridian:meridian@db:5432/meridian
      CORS_ALLOW_ORIGINS: http://localhost:3010,http://localhost:3000,http://127.0.0.1:3010,http://127.0.0.1:3000
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: meridian-evidence
    ports:
      - "8010:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --app-dir services/api --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: ./services/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Least privilege (M4/M5.2): the worker needs the database plus
      # read-only repository-bucket access for snapshot materialization.
      # Dev-only values for the dedicated read-only MinIO user created in
      # minio-init; production must inject vault-managed secrets. Root
      # MinIO credentials stay out, and untrusted execution containers
      # never see any credentials at all.
      MERIDIAN_ENV: dev
      DATABASE_URL: postgresql+psycopg://meridian:meridian@db:5432/meridian
      WORKER_ID: compose-worker-1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: meridian-worker
      S3_SECRET_KEY: meridian-worker-secret
      S3_REGION: us-east-1
    security_opt:
      - no-new-privileges:true

volumes:
  meridian_pgdata:
  meridian_miniodata:
